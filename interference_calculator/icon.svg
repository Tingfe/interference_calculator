<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141432"/>
      <stop offset="40%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>

    <!-- Left peak: analyte (cyan → blue) -->
    <linearGradient id="peakAnalyte" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#3b6fff"/>
    </linearGradient>

    <!-- Right peak: interferent (orange → magenta) -->
    <linearGradient id="peakInterferent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="100%" stop-color="#d040ff"/>
    </linearGradient>

    <!-- Overlap blend -->
    <linearGradient id="overlapBlend" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cc2266"/>
      <stop offset="100%" stop-color="#7733cc"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for peaks -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="108"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Peak glow layers (behind main peaks for depth) -->
  <!-- Analyte glow -->
  <path d="M80,400 C80,400 130,380 170,280 C195,210 210,160 210,130
           C220,110 235,110 245,130 C245,160 260,210 285,280
           C325,380 375,400 375,400"
        fill="none" stroke="#00c8ff" stroke-width="28" stroke-linecap="round"
        filter="url(#softGlow)" opacity="0.25"/>

  <!-- Interferent glow -->
  <path d="M195,400 C195,400 245,380 285,300 C310,245 325,200 325,165
           C335,145 350,145 360,165 C360,200 375,245 400,300
           C440,380 490,400 490,400"
        fill="none" stroke="#ff5e3a" stroke-width="28" stroke-linecap="round"
        filter="url(#softGlow)" opacity="0.25"/>

  <!-- Main peaks -->
  <!-- Analyte peak (left, blue/cyan) -->
  <path d="M80,400 L110,400 C110,400 155,380 185,280
           C210,200 220,150 220,125
           C228,100 242,100 250,125
           C250,150 260,200 285,300
           C315,380 360,400 390,400"
        fill="none" stroke="url(#peakAnalyte)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Interferent peak (right, orange/magenta, shifted right to overlap) -->
  <path d="M195,400 L225,400 C225,400 265,380 290,310
           C315,235 325,180 328,155
           C335,135 350,135 358,158
           C358,180 365,235 385,310
           C410,380 445,400 475,400"
        fill="none" stroke="url(#peakInterferent)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Overlap zone highlight (between the two peaks, around x=260-310) -->
  <path d="M250,128 C255,158 268,220 295,315
           C305,346 315,374 325,398"
        fill="none" stroke="url(#overlapBlend)" stroke-width="18"
        stroke-linecap="round"
        filter="url(#softGlow)" opacity="0.7"/>

  <!-- Baseline (mass axis) -->
  <line x1="80" y1="400" x2="475" y2="400"
        stroke="rgba(255,255,255,0.2)" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Baseline tick marks -->
  <line x1="220" y1="400" x2="220" y2="412"
        stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
  <line x1="328" y1="400" x2="328" y2="412"
        stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>

  <!-- Delta-m label -->
  <text x="274" y="425"
        fill="rgba(255,255,255,0.4)"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500" text-anchor="middle"
        letter-spacing="1">Δm/z</text>
</svg>
