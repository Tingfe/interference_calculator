[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "interference-calculator"
version = "2.8.2"
description = "Inorganic mass spectrometry interference calculator for GDMS, ICP-MS, and SIMS"
authors = ["Interference Calculator Team <me@example.com>"]
maintainers = ["Interference Calculator Team <me@example.com>"]
license = "BSD-3-Clause"
readme = "README.rst"
homepage = "https://github.com/Tingfe/interference_calculator"
repository = "https://github.com/Tingfe/interference_calculator"
documentation = "https://github.com/Tingfe/interference_calculator/tree/main/docs"
keywords = ["interference", "mass-spectrometry", "isotope", "element", "gdms", "icp-ms", "sims"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = "*"
openpyxl = "*"
pandas = "*"
pyparsing = "*"
PyQt5 = "*"
PyYAML = {version = "*", optional = true}
requests = {version = "*", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
sphinx = ">=4.0"
sphinx-rtd-theme = ">=1.0"
flake8 = ">=6.0"
mypy = ">=1.0"
black = ">=23.0"
isort = ">=5.0"

[tool.poetry.extras]
data = ["requests"]
plugins = ["PyYAML"]

[tool.poetry.scripts]
interference_calculator = "interference_calculator.ui:run"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/Tingfe/interference_calculator/issues"
"Changelog" = "https://github.com/Tingfe/interference_calculator/blob/main/CHANGELOG.md"

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "interference_calculator.ui",
    "interference_calculator.ui_components.*",
]
disallow_untyped_defs = false
ignore_missing_imports = true
