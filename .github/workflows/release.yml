name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Interference Calculator ${{ github.ref_name }}"
          body: |
            ## Interference Calculator ${{ github.ref_name }}

            ### Installation

            ```bash
            pip install interference_calculator
            ```

            Or download the wheel below and install manually:

            ```bash
            pip install interference_calculator-*.whl
            ```
          files: |
            *.tar.gz
            *.whl
          draft: false
          prerelease: false
