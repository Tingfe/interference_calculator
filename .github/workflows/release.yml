name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Validate version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate release metadata
        id: meta
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          init_text = Path("interference_calculator/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text)
          if not match:
              raise SystemExit("Could not find __version__ in interference_calculator/__init__.py")
          version = match.group(1)
          tag_name = f"v{version}"

          github_ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          github_ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if github_ref_type == "tag":
              if not github_ref_name.startswith("v"):
                  raise SystemExit(f"Release tags must start with v: {github_ref_name}")
              tag_version = github_ref_name[1:]
              if tag_version != version:
                  raise SystemExit(
                      f"Tag version {tag_version} does not match package __version__ {version}"
                  )
              tag_name = github_ref_name

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing a ## [{version}] section")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag_name={tag_name}\n")

      - name: Extract release notes
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = "${{ steps.meta.outputs.version }}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = None
          for index, line in enumerate(changelog):
              if line.strip().startswith(f"## [{version}]"):
                  start = index + 1
                  break
          if start is None:
              raise SystemExit(f"CHANGELOG.md is missing ## [{version}]")

          end = len(changelog)
          for index in range(start, len(changelog)):
              if re.match(r"^## \[", changelog[index]):
                  end = index
                  break

          body = "\n".join(changelog[start:end]).strip()
          if not body:
              body = f"Release {version}"
          Path("release_body.md").write_text(body + "\n", encoding="utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_body.md

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-python:
    name: Build Python packages
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  build-macos:
    name: Build macOS app
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UPX
        run: brew install upx

      - name: Install app build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]" pyinstaller

      - name: Build macOS app bundle
        run: |
          pyinstaller \
            --name "Interference Calculator" \
            --windowed \
            --strip \
            --icon interference_calculator/icon.icns \
            --add-data "interference_calculator/periodic_table.csv:interference_calculator" \
            --add-data "interference_calculator/icon.svg:interference_calculator" \
            --add-data "interference_calculator/icon.ico:interference_calculator" \
            --add-data "interference_calculator/icon.icns:interference_calculator" \
            --add-data "interference_calculator/display_button_icon.svg:interference_calculator" \
            --add-data "interference_calculator/help_button_icon.svg:interference_calculator" \
            --hidden-import PyQt5.QtSvg \
            --hidden-import openpyxl \
            --exclude-module PyQt5.QtNetwork \
            --exclude-module PyQt5.QtMultimedia \
            --exclude-module PyQt5.QtMultimediaWidgets \
            --exclude-module PyQt5.QtQml \
            --exclude-module PyQt5.QtQuick \
            --exclude-module PyQt5.QtQuickWidgets \
            --exclude-module PyQt5.QtWebEngine \
            --exclude-module PyQt5.QtWebEngineWidgets \
            --exclude-module PyQt5.QtWebChannel \
            --exclude-module PyQt5.QtXml \
            --exclude-module PyQt5.QtXmlPatterns \
            --exclude-module PyQt5.QtSql \
            --exclude-module PyQt5.QtTest \
            --exclude-module PyQt5.QtPrintSupport \
            --exclude-module PyQt5.QtHelp \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtSensors \
            --exclude-module PyQt5.QtSerialPort \
            --exclude-module PyQt5.QtWebSockets \
            --exclude-module PyQt5.QtDBus \
            --exclude-module PyQt5.QtDesigner \
            --exclude-module PyQt5.QtOpenGL \
            --exclude-module PyQt5.QtOpenGLWidgets \
            --exclude-module PyQt5.QtLocation \
            --exclude-module PyQt5.QtPdf \
            --exclude-module PyQt5.QtPdfWidgets \
            --exclude-module PyQt5.QtScxml \
            --exclude-module PyQt5.QtStateMachine \
            --exclude-module PyQt5.QtTextToSpeech \
            --exclude-module PyQt5.QtUiTools \
            interference_calculator/ui.py

      - name: Package macOS DMG
        run: |
          hdiutil create \
            -volname "Interference Calculator" \
            -srcfolder "dist/Interference Calculator.app" \
            -ov -format UDZO \
            "dist/InterferenceCalculator-macOS-${{ needs.prepare.outputs.tag_name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/InterferenceCalculator-macOS-*.dmg

  build-windows:
    name: Build Windows app
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UPX
        run: choco install upx --no-progress

      - name: Install app build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]" pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller `
            --name "InterferenceCalculator" `
            --onefile `
            --windowed `
            --icon interference_calculator/icon.ico `
            --add-data "interference_calculator/periodic_table.csv;interference_calculator" `
            --add-data "interference_calculator/icon.svg;interference_calculator" `
            --add-data "interference_calculator/icon.ico;interference_calculator" `
            --add-data "interference_calculator/icon.icns;interference_calculator" `
            --add-data "interference_calculator/display_button_icon.svg;interference_calculator" `
            --add-data "interference_calculator/help_button_icon.svg;interference_calculator" `
            --hidden-import PyQt5.QtSvg `
            --hidden-import openpyxl `
            --exclude-module PyQt5.QtNetwork `
            --exclude-module PyQt5.QtMultimedia `
            --exclude-module PyQt5.QtMultimediaWidgets `
            --exclude-module PyQt5.QtQml `
            --exclude-module PyQt5.QtQuick `
            --exclude-module PyQt5.QtQuickWidgets `
            --exclude-module PyQt5.QtWebEngine `
            --exclude-module PyQt5.QtWebEngineWidgets `
            --exclude-module PyQt5.QtWebChannel `
            --exclude-module PyQt5.QtXml `
            --exclude-module PyQt5.QtXmlPatterns `
            --exclude-module PyQt5.QtSql `
            --exclude-module PyQt5.QtTest `
            --exclude-module PyQt5.QtPrintSupport `
            --exclude-module PyQt5.QtHelp `
            --exclude-module PyQt5.QtBluetooth `
            --exclude-module PyQt5.QtNfc `
            --exclude-module PyQt5.QtPositioning `
            --exclude-module PyQt5.QtSensors `
            --exclude-module PyQt5.QtSerialPort `
            --exclude-module PyQt5.QtWebSockets `
            --exclude-module PyQt5.QtDBus `
            --exclude-module PyQt5.QtDesigner `
            --exclude-module PyQt5.QtOpenGL `
            --exclude-module PyQt5.QtOpenGLWidgets `
            --exclude-module PyQt5.QtLocation `
            --exclude-module PyQt5.QtPdf `
            --exclude-module PyQt5.QtPdfWidgets `
            --exclude-module PyQt5.QtScxml `
            --exclude-module PyQt5.QtStateMachine `
            --exclude-module PyQt5.QtTextToSpeech `
            --exclude-module PyQt5.QtUiTools `
            interference_calculator/ui.py

      - name: Rename executable with version
        run: |
          Rename-Item `
            -Path "dist/InterferenceCalculator.exe" `
            -NewName "InterferenceCalculator-Windows-${{ needs.prepare.outputs.tag_name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/InterferenceCalculator-Windows-*.exe

  release:
    name: Publish GitHub Release
    needs: [prepare, test, build-python, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Interference Calculator ${{ needs.prepare.outputs.tag_name }}"
          body_path: release/release_body.md
          files: dist/*
          draft: false
          prerelease: false
