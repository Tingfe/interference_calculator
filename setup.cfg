[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv,
    .pytest_cache,
    docs/api/_build
per-file-ignores =
    interference_calculator/ui.py: E501
    interference_calculator/ui_components/*.py: E501
statistics = True
count = True
show-source = True
