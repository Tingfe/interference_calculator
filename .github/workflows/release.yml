name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Validate version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate release metadata
        id: meta
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          init_text = Path("interference_calculator/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text)
          if not match:
              raise SystemExit("Could not find __version__ in interference_calculator/__init__.py")
          version = match.group(1)
          tag_name = f"v{version}"

          github_ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          github_ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if github_ref_type == "tag":
              if not github_ref_name.startswith("v"):
                  raise SystemExit(f"Release tags must start with v: {github_ref_name}")
              tag_version = github_ref_name[1:]
              if tag_version != version:
                  raise SystemExit(
                      f"Tag version {tag_version} does not match package __version__ {version}"
                  )
              tag_name = github_ref_name

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section_match = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not section_match:
              raise SystemExit(f"CHANGELOG.md is missing a ## [{version}] section")
          release_section = section_match.group(0)
          for heading in ("### English", "### 中文"):
              if heading not in release_section:
                  raise SystemExit(
                      f"CHANGELOG.md section ## [{version}] must include {heading}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag_name={tag_name}\n")

      - name: Extract release notes
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = "${{ steps.meta.outputs.version }}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = None
          for index, line in enumerate(changelog):
              if line.strip().startswith(f"## [{version}]"):
                  start = index + 1
                  break
          if start is None:
              raise SystemExit(f"CHANGELOG.md is missing ## [{version}]")

          end = len(changelog)
          for index in range(start, len(changelog)):
              if re.match(r"^## \[", changelog[index]):
                  end = index
                  break

          body = "\n".join(changelog[start:end]).strip()
          if not body:
              body = f"Release {version}"
          Path("release_body.md").write_text(body + "\n", encoding="utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_body.md

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-python:
    name: Build Python packages
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  build-macos:
    name: Build macOS app
    needs: [prepare, test]
    runs-on: macos-latest
    env:
      MACOS_BUNDLE_ID: com.tingfe.interferencecalculator
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect macOS signing configuration
        id: macos-signing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_CODESIGN_IDENTITY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID \
            MACOS_NOTARY_KEY_P8_BASE64
          do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::warning::Building an unsigned, non-notarized macOS DMG. Gatekeeper may block it after download."
            echo "MACOS_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
            echo "MACOS_OUTPUT_SUFFIX=-unsigned" >> "$GITHUB_ENV"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          else
            echo "MACOS_SIGNING_MODE=signed" >> "$GITHUB_ENV"
            echo "MACOS_OUTPUT_SUFFIX=" >> "$GITHUB_ENV"
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.macos-signing.outputs.mode == 'signed'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install UPX
        run: brew install upx

      - name: Install app build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]" pyinstaller

      - name: Build macOS app bundle
        run: |
          PYINSTALLER_CODESIGN_ARGS=(--osx-bundle-identifier "$MACOS_BUNDLE_ID")
          if [ "$MACOS_SIGNING_MODE" = "signed" ]; then
            PYINSTALLER_CODESIGN_ARGS+=(
              --codesign-identity "$MACOS_CODESIGN_IDENTITY"
              --osx-entitlements-file packaging/macos/entitlements.plist
            )
          fi

          pyinstaller \
            --name "Interference Calculator" \
            --windowed \
            --strip \
            "${PYINSTALLER_CODESIGN_ARGS[@]}" \
            --icon interference_calculator/icon.icns \
            --add-data "interference_calculator/periodic_table.csv:interference_calculator" \
            --add-data "interference_calculator/icon.svg:interference_calculator" \
            --add-data "interference_calculator/icon.ico:interference_calculator" \
            --add-data "interference_calculator/icon.icns:interference_calculator" \
            --add-data "interference_calculator/display_button_icon.svg:interference_calculator" \
            --add-data "interference_calculator/help_button_icon.svg:interference_calculator" \
            --hidden-import PyQt5.QtSvg \
            --hidden-import openpyxl \
            --exclude-module PyQt5.QtNetwork \
            --exclude-module PyQt5.QtMultimedia \
            --exclude-module PyQt5.QtMultimediaWidgets \
            --exclude-module PyQt5.QtQml \
            --exclude-module PyQt5.QtQuick \
            --exclude-module PyQt5.QtQuickWidgets \
            --exclude-module PyQt5.QtWebEngine \
            --exclude-module PyQt5.QtWebEngineWidgets \
            --exclude-module PyQt5.QtWebChannel \
            --exclude-module PyQt5.QtXml \
            --exclude-module PyQt5.QtXmlPatterns \
            --exclude-module PyQt5.QtSql \
            --exclude-module PyQt5.QtTest \
            --exclude-module PyQt5.QtPrintSupport \
            --exclude-module PyQt5.QtHelp \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtSensors \
            --exclude-module PyQt5.QtSerialPort \
            --exclude-module PyQt5.QtWebSockets \
            --exclude-module PyQt5.QtDBus \
            --exclude-module PyQt5.QtDesigner \
            --exclude-module PyQt5.QtOpenGL \
            --exclude-module PyQt5.QtOpenGLWidgets \
            --exclude-module PyQt5.QtLocation \
            --exclude-module PyQt5.QtPdf \
            --exclude-module PyQt5.QtPdfWidgets \
            --exclude-module PyQt5.QtScxml \
            --exclude-module PyQt5.QtStateMachine \
            --exclude-module PyQt5.QtTextToSpeech \
            --exclude-module PyQt5.QtUiTools \
            interference_calculator/ui.py

      - name: Finalize and verify macOS app signature
        run: |
          APP_PATH="dist/Interference Calculator.app"
          VERSION="${{ needs.prepare.outputs.version }}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $MACOS_BUNDLE_ID" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP_PATH/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$APP_PATH/Contents/Info.plist"

          if [ "$MACOS_SIGNING_MODE" = "signed" ]; then
            codesign \
              --force \
              --deep \
              --options runtime \
              --timestamp \
              --entitlements packaging/macos/entitlements.plist \
              --sign "$MACOS_CODESIGN_IDENTITY" \
              "$APP_PATH"
          else
            echo "::warning::No Developer ID identity configured; creating an ad-hoc signed app for non-release testing only."
            codesign --force --deep --sign - "$APP_PATH"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

      - name: Package macOS DMG
        run: |
          hdiutil create \
            -volname "Interference Calculator" \
            -srcfolder "dist/Interference Calculator.app" \
            -ov -format UDZO \
            "dist/InterferenceCalculator-macOS${MACOS_OUTPUT_SUFFIX}-${{ needs.prepare.outputs.tag_name }}.dmg"

      - name: Sign, notarize, and staple macOS DMG
        if: steps.macos-signing.outputs.mode == 'signed'
        run: |
          DMG_PATH="dist/InterferenceCalculator-macOS${MACOS_OUTPUT_SUFFIX}-${{ needs.prepare.outputs.tag_name }}.dmg"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"

          codesign --force --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          spctl -a -vv -t open "$DMG_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/InterferenceCalculator-macOS-*.dmg

  build-windows:
    name: Build Windows app
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]" pyinstaller

      - name: Build Windows app directory
        run: |
          pyinstaller `
            --name "InterferenceCalculator" `
            --windowed `
            --noupx `
            --icon interference_calculator/icon.ico `
            --add-data "interference_calculator/periodic_table.csv;interference_calculator" `
            --add-data "interference_calculator/icon.svg;interference_calculator" `
            --add-data "interference_calculator/icon.ico;interference_calculator" `
            --add-data "interference_calculator/icon.icns;interference_calculator" `
            --add-data "interference_calculator/display_button_icon.svg;interference_calculator" `
            --add-data "interference_calculator/help_button_icon.svg;interference_calculator" `
            --hidden-import PyQt5.QtSvg `
            --hidden-import openpyxl `
            --exclude-module PyQt5.QtNetwork `
            --exclude-module PyQt5.QtMultimedia `
            --exclude-module PyQt5.QtMultimediaWidgets `
            --exclude-module PyQt5.QtQml `
            --exclude-module PyQt5.QtQuick `
            --exclude-module PyQt5.QtQuickWidgets `
            --exclude-module PyQt5.QtWebEngine `
            --exclude-module PyQt5.QtWebEngineWidgets `
            --exclude-module PyQt5.QtWebChannel `
            --exclude-module PyQt5.QtXml `
            --exclude-module PyQt5.QtXmlPatterns `
            --exclude-module PyQt5.QtSql `
            --exclude-module PyQt5.QtTest `
            --exclude-module PyQt5.QtPrintSupport `
            --exclude-module PyQt5.QtHelp `
            --exclude-module PyQt5.QtBluetooth `
            --exclude-module PyQt5.QtNfc `
            --exclude-module PyQt5.QtPositioning `
            --exclude-module PyQt5.QtSensors `
            --exclude-module PyQt5.QtSerialPort `
            --exclude-module PyQt5.QtWebSockets `
            --exclude-module PyQt5.QtDBus `
            --exclude-module PyQt5.QtDesigner `
            --exclude-module PyQt5.QtOpenGL `
            --exclude-module PyQt5.QtOpenGLWidgets `
            --exclude-module PyQt5.QtLocation `
            --exclude-module PyQt5.QtPdf `
            --exclude-module PyQt5.QtPdfWidgets `
            --exclude-module PyQt5.QtScxml `
            --exclude-module PyQt5.QtStateMachine `
            --exclude-module PyQt5.QtTextToSpeech `
            --exclude-module PyQt5.QtUiTools `
            interference_calculator/ui.py

      - name: Package Windows app directory
        run: |
          Compress-Archive `
            -Path "dist/InterferenceCalculator/*" `
            -DestinationPath "dist/InterferenceCalculator-Windows-${{ needs.prepare.outputs.tag_name }}.zip" `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/InterferenceCalculator-Windows-*.zip

  release:
    name: Publish GitHub Release
    needs: [prepare, test, build-python, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Interference Calculator ${{ needs.prepare.outputs.tag_name }}"
          body_path: release/release_body.md
          files: dist/*
          draft: false
          prerelease: false

  sync-gitee-release:
    name: Sync Gitee Release
    needs: [prepare, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITEE_OWNER: tyongs
      GITEE_REPO: interference_calculator
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      GITEE_MAX_ASSET_BYTES: 10485760
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Gitee sync configuration
        id: gitee-sync
        shell: bash
        run: |
          if [ -z "$GITEE_ACCESS_TOKEN" ]; then
            echo "::warning::GITEE_ACCESS_TOKEN is not configured; skipping Gitee Release sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release tag to Gitee
        if: steps.gitee-sync.outputs.enabled == 'true'
        shell: bash
        run: |
          cleanup() {
            rm -f "$HOME/.netrc"
          }
          trap cleanup EXIT

          cat > "$HOME/.netrc" <<EOF
          machine gitee.com
          login ${GITEE_USERNAME:-$GITEE_OWNER}
          password $GITEE_ACCESS_TOKEN
          EOF
          chmod 600 "$HOME/.netrc"

          git push \
            "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

      - uses: actions/download-artifact@v4
        if: steps.gitee-sync.outputs.enabled == 'true'
        with:
          name: release-notes
          path: release/

      - uses: actions/download-artifact@v4
        if: steps.gitee-sync.outputs.enabled == 'true'
        with:
          name: python-packages
          path: dist/

      - uses: actions/download-artifact@v4
        if: steps.gitee-sync.outputs.enabled == 'true'
        with:
          name: macos-app
          path: dist/

      - uses: actions/download-artifact@v4
        if: steps.gitee-sync.outputs.enabled == 'true'
        with:
          name: windows-app
          path: dist/

      - name: Upload assets to Gitee Release
        if: steps.gitee-sync.outputs.enabled == 'true'
        shell: bash
        run: |
          cat >> release/release_body.md <<EOF

          ## Binary Downloads / 安装包下载

          Windows and macOS standalone apps are built by GitHub Actions and hosted on GitHub Releases:
          https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}

          Gitee mirrors the source distribution and Python wheel. Large desktop installers are linked to GitHub to avoid unstable large-file uploads through the Gitee API.
          EOF

          python .github/scripts/sync_gitee_release.py \
            --owner "$GITEE_OWNER" \
            --repo "$GITEE_REPO" \
            --tag "$TAG_NAME" \
            --name "Interference Calculator $TAG_NAME" \
            --body-file release/release_body.md \
            --target-commitish main \
            --max-asset-bytes "$GITEE_MAX_ASSET_BYTES" \
            --assets dist/*
